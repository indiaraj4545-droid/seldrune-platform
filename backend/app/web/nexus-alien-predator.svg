<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Alien versus Predator cinematic holographic duel</title>
<desc id="desc">An original biomechanical alien faces an armored extraterrestrial hunter inside a dark starship arena, with a glowing energy rift between them.</desc>
<defs>
  <radialGradient id="void" cx="50%" cy="42%" r="75%"><stop stop-color="#11294d"/><stop offset=".42" stop-color="#080f21"/><stop offset="1" stop-color="#01030a"/></radialGradient>
  <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182638" stop-opacity=".08"/><stop offset=".22" stop-color="#08121e" stop-opacity=".76"/><stop offset="1" stop-color="#010309"/></linearGradient>
  <linearGradient id="xenoShell" x1=".08" y1=".05" x2=".92" y2="1"><stop stop-color="#b7fbff"/><stop offset=".16" stop-color="#396376"/><stop offset=".39" stop-color="#111c2c"/><stop offset=".7" stop-color="#060b15"/><stop offset="1" stop-color="#546e7f"/></linearGradient>
  <linearGradient id="xenoRidge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6f6ff"/><stop offset=".35" stop-color="#347c91"/><stop offset="1" stop-color="#101b2a"/></linearGradient>
  <linearGradient id="hunterArmor" x1=".1" y1=".05" x2=".9" y2="1"><stop stop-color="#e2c27d"/><stop offset=".2" stop-color="#705438"/><stop offset=".5" stop-color="#252e39"/><stop offset=".76" stop-color="#121a28"/><stop offset="1" stop-color="#b76c3e"/></linearGradient>
  <linearGradient id="hunterMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe5a0"/><stop offset=".4" stop-color="#7e664a"/><stop offset="1" stop-color="#293241"/></linearGradient>
  <radialGradient id="rift" cx="50%" cy="48%" r="52%"><stop stop-color="#e1fbff" stop-opacity=".95"/><stop offset=".12" stop-color="#5cf3ff" stop-opacity=".82"/><stop offset=".32" stop-color="#6a5fff" stop-opacity=".46"/><stop offset=".68" stop-color="#b740ff" stop-opacity=".13"/><stop offset="1" stop-color="#02040d" stop-opacity="0"/></radialGradient>
  <linearGradient id="riftBeam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35eaff" stop-opacity="0"/><stop offset=".5" stop-color="#d8ffff" stop-opacity=".92"/><stop offset="1" stop-color="#ff62d4" stop-opacity="0"/></linearGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="edgeGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="17"/></filter>
  <pattern id="floorGrid" width="70" height="45" patternUnits="userSpaceOnUse"><path d="M70 0H0V45" fill="none" stroke="#52c9ec" stroke-opacity=".16" stroke-width="1"/></pattern>
</defs>
<style>
  @keyframes xenoLunge { 0%,100% { transform:translate(-5px,0) rotate(-.6deg) } 50% { transform:translate(10px,-7px) rotate(.8deg) } }
  @keyframes hunterShift { 0%,100% { transform:translate(5px,0) rotate(.35deg) } 50% { transform:translate(-9px,-4px) rotate(-.45deg) } }
  @keyframes riftPulse { 0%,100% { opacity:.7; transform:scale(.97) } 50% { opacity:1; transform:scale(1.04) } }
  @keyframes scannerSweep { 0% { transform:translateY(-120px);opacity:0 } 15%,75% {opacity:.5} 100% {transform:translateY(620px);opacity:0} }
  #xenomorph { transform-origin:455px 470px; animation:xenoLunge 5.8s ease-in-out infinite }
  #hunter { transform-origin:1148px 468px; animation:hunterShift 6.4s ease-in-out infinite }
  #riftField { transform-origin:800px 470px; animation:riftPulse 3.4s ease-in-out infinite }
  #scan { animation:scannerSweep 9s linear infinite }
  @media (prefers-reduced-motion: reduce) { #xenomorph,#hunter,#riftField,#scan { animation:none!important } }
</style>
